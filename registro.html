<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta na VIARE para acessar hospedagens, pacotes de viagem e ofertas exclusivas.">
  <title>VIARE — Criar Conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">VIARE</div>
      <h1 class="auth-title">Crie sua conta</h1>

      <form id="registro-form" class="auth-form" novalidate>
        
        <div class="form-group">
          <label class="form-label" for="registro-nome">Nome Completo</label>
          <input 
            type="text" 
            id="registro-nome" 
            class="form-input" 
            placeholder="Ex: Maria da Silva" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="registro-email">E-mail</label>
          <input 
            type="email" 
            id="registro-email" 
            class="form-input" 
            placeholder="seu@email.com" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="registro-senha">Senha</label>
          <input 
            type="password" 
            id="registro-senha" 
            class="form-input" 
            placeholder="••••••••" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="registro-confirmar">Confirmar Senha</label>
          <input 
            type="password" 
            id="registro-confirmar" 
            class="form-input" 
            placeholder="••••••••" 
            required
          >
          <p id="registro-senha-error" class="form-error">As senhas não coincidem</p>
        </div>

        <button type="submit" class="btn btn-primary-full">Finalizar Cadastro</button>
      </form>

      <div class="auth-footer">
        Já possui uma conta? <a href="index.html">Faça Login</a>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
